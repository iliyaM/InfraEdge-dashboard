<div [class]="'task-card ' + task.priority">
  <p class="task-title">{{ task.title }}</p>
  <div class="card-footer">
    <span [class]="'priority-badge ' + task.priority">{{ priorityLabel(task.priority) }}</span>
    <div class="card-footer-end">
      <select class="status-select" [value]="displayStatus()"
              (change)="onStatusChange($any($event.target).value)">
        <option value="todo">לביצוע</option>
        <option value="in-progress">בביצוע</option>
        <option value="done">הושלם</option>
      </select>
      <button class="delete-btn" type="button" (click)="deleteRequested.emit()"
              [disabled]="isDeleting">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </button>
    </div>
  </div>

</div>
